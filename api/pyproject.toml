[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dhara-api"
version = "0.1.0"
description = "DHARĀ FastAPI backend — serves Change Passports to the frontend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Use SQLite for MVP (documented choice: team size 1-2, time-constrained)
    # Switch to asyncpg + PostgreSQL for production
    "aiosqlite>=0.20",
    "jsonschema>=4.21",
    "python-dotenv>=1.0",
    "slowapi>=0.1",  # Rate limiting for POST /observations
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",  # TestClient for FastAPI integration tests
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
