[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dhara-pipeline"
version = "0.1.0"
description = "DHARĀ data acquisition, preprocessing, change detection, and confidence scoring pipeline"
requires-python = ">=3.11"
dependencies = [
    # Data access
    "asf_search>=7.0",
    "requests>=2.31",
    # Scientific computing
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    # Geospatial
    "rasterio>=1.3",
    "geopandas>=0.14",
    "pyproj>=3.6",
    "shapely>=2.0",
    "richdem>=2.3",
    # HDF5 reading (NISAR GUNW/GOFF/GCOV)
    "h5py>=3.10",
    # Validation & schema
    "jsonschema>=4.21",
    # Utilities
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
